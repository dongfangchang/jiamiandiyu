<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>假面低语 · 美术样张</title>
  <style>
    :root { color-scheme: dark; --ink:#171613; --paper:#d8c29a; --gold:#b99750; --blood:#7a2828; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: #e8dfc9; font-family: "Noto Serif SC", "Songti SC", Georgia, serif; }
    header { padding: 64px 7vw 34px; border-bottom: 1px solid #6b5934; }
    h1 { margin: 0; font-size: clamp(36px, 6vw, 82px); letter-spacing: .18em; font-weight: 700; }
    header p { margin: 18px 0 0; color: var(--gold); letter-spacing: .2em; }
    main { columns: 3 280px; column-gap: 22px; padding: 32px 4vw 80px; }
    figure { margin: 0 0 24px; break-inside: avoid; border: 1px solid #4d432f; background: #211f1b; }
    figure.wide { column-span: all; }
    img { display: block; width: 100%; height: auto; }
    figcaption { display: flex; justify-content: space-between; gap: 16px; padding: 13px 15px; color: #bfb393; font-size: 13px; }
    figcaption strong { color: #e8dfc9; font-weight: 600; }
    footer { padding: 0 7vw 50px; color: #746b59; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>假面低语</h1>
    <p>PRIVATE OCCULT CARD PROTOTYPE / ART DIRECTION 01</p>
  </header>
  <main>
  <figure class="wide">
    <img src="../assets/svg/title-screen.svg" alt="标题画面">
    <figcaption><strong>标题画面</strong><span>16:9 · 1600 x 900</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/cards/card-identity-reporter.svg" alt="人格牌：记者">
    <figcaption><strong>人格牌：记者</strong><span>2:3 · 600 x 840</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/cards/card-identity-doctor.svg" alt="人格牌：医生">
    <figcaption><strong>人格牌：医生</strong><span>2:3 · 600 x 840</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/cards/card-identity-gravedigger.svg" alt="人格牌：守墓人">
    <figcaption><strong>人格牌：守墓人</strong><span>2:3 · 600 x 840</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/cards/card-artifact-watchers-eye.svg" alt="封印物：窥视者之眼">
    <figcaption><strong>封印物：窥视者之眼</strong><span>2:3 · 600 x 840</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/cards/card-artifact-faceless-mask.svg" alt="封印物：无面遗嘱">
    <figcaption><strong>封印物：无面遗嘱</strong><span>2:3 · 600 x 840</span></figcaption>
  </figure>

  <figure class="">
    <img src="../assets/svg/enemies/enemy-lantern-pursuer.svg" alt="敌人：提灯追猎者">
    <figcaption><strong>敌人：提灯追猎者</strong><span>1:1 · 900 x 900</span></figcaption>
  </figure>

  <figure class="wide">
    <img src="../assets/svg/scenes/ritual-ascension.svg" alt="晋升试炼">
    <figcaption><strong>晋升试炼</strong><span>16:9 · 1600 x 900</span></figcaption>
  </figure>

  <figure class="wide">
    <img src="../assets/svg/icons/status-sheet.svg" alt="状态图标">
    <figcaption><strong>状态图标</strong><span>3:2 · 1200 x 800</span></figcaption>
  </figure>
</main>
  <footer>程序化 SVG 原型资产。正式插画可沿用同一卡框和文字安全区替换。</footer>
</body>
</html>
