<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>假面低语 v0.6.0 · 挑战美术候选</title>
  <style>
    :root { color-scheme:dark; --ink:#10130f; --gold:#b99750; --bone:#e8dfc9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:var(--bone); font-family:"Noto Serif SC","Songti SC",Georgia,serif; }
    header { padding:36px 5vw 20px; border-bottom:1px solid #5a4a31; }
    h1 { margin:0; font-size:44px; letter-spacing:.12em; }
    header p { color:var(--gold); letter-spacing:.14em; }
    section { padding:22px 4vw 28px; }
    h2 { color:var(--gold); font-size:18px; letter-spacing:.16em; border-bottom:1px solid #453b29; padding-bottom:7px; }
    .grid { display:grid; gap:14px; align-items:start; }
    .scenes { grid-template-columns:1fr; }
    .icons { grid-template-columns:repeat(5,1fr); }
    figure { margin:0; background:#1a1e19; border:1px solid #473e2c; }
    img { display:block; width:100%; height:230px; object-fit:contain; background:#141813; }
    .scenes img { height:auto; max-height:620px; }
    figcaption { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; font-size:11px; color:#a99b7f; }
    figcaption strong { color:var(--bone); font-weight:500; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>假面低语 · v0.6 挑战候选</h1>
    <p>CHALLENGE / MODIFIERS / RESULT / UI REVIEW REQUIRED</p>
  </header>
  
  <section>
    <h2>挑战背景</h2>
    <div class="grid scenes">
      
        <figure>
          <img src="../../assets/svg/v0.6.0/scenes/challenge-selection.svg" alt="scene.challenge.selection">
          <figcaption><strong>scene.challenge.selection</strong><span>1600 × 900</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/scenes/challenge-result.svg" alt="scene.challenge.result">
          <figcaption><strong>scene.challenge.result</strong><span>1600 × 900</span></figcaption>
        </figure>
      
    </div>
  </section>

  <section>
    <h2>挑战徽记与修饰</h2>
    <div class="grid icons">
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-pressure-advance.svg" alt="challenge.modifier.pressure_advance">
          <figcaption><strong>challenge.modifier.pressure_advance</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-mirror-echo.svg" alt="challenge.modifier.mirror_echo">
          <figcaption><strong>challenge.modifier.mirror_echo</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-restricted-reward.svg" alt="challenge.modifier.restricted_reward">
          <figcaption><strong>challenge.modifier.restricted_reward</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-compact-deck.svg" alt="challenge.modifier.compact_deck">
          <figcaption><strong>challenge.modifier.compact_deck</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-reinforced-guard.svg" alt="challenge.modifier.reinforced_guard">
          <figcaption><strong>challenge.modifier.reinforced_guard</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/modifier-early-phase.svg" alt="challenge.modifier.early_phase">
          <figcaption><strong>challenge.modifier.early_phase</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/challenge-success.svg" alt="status.challenge.success">
          <figcaption><strong>status.challenge.success</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/challenge-failure.svg" alt="status.challenge.failure">
          <figcaption><strong>status.challenge.failure</strong><span>128 × 128</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/challenge-emblem.svg" alt="challenge.mode.emblem">
          <figcaption><strong>challenge.mode.emblem</strong><span>256 × 256</span></figcaption>
        </figure>
      
        <figure>
          <img src="../../assets/svg/v0.6.0/icons/deck-restricted.svg" alt="challenge.deck.restricted">
          <figcaption><strong>challenge.deck.restricted</strong><span>128 × 128</span></figcaption>
        </figure>
      
    </div>
  </section>

</body>
</html>
