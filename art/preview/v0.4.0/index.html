<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>假面低语 v0.4.0 · 美术候选</title>
  <style>
    :root { color-scheme:dark; --ink:#10130f; --paper:#d8c29a; --gold:#b99750; --blood:#7a2828; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:#e8dfc9; font-family:"Noto Serif SC","Songti SC",Georgia,serif; }
    header { padding:40px 5vw 24px; border-bottom:1px solid #5a4a31; }
    h1 { margin:0; font-size:48px; letter-spacing:.12em; }
    header p { color:var(--gold); letter-spacing:.14em; }
    section { padding:20px 4vw 24px; }
    h2 { color:var(--gold); font-size:19px; letter-spacing:.16em; border-bottom:1px solid #453b29; padding-bottom:8px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .grid.scenes { grid-template-columns:repeat(2,1fr); }
    .grid.icons { grid-template-columns:repeat(5,1fr); }
    figure { margin:0; background:#1a1e19; border:1px solid #473e2c; }
    img { display:block; width:100%; height:200px; object-fit:contain; background:#141813; }
    .scenes img { height:230px; }
    figcaption { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; font-size:11px; color:#a99b7f; }
    figcaption strong { color:#e8dfc9; font-weight:500; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>假面低语 · v0.4 美术候选</h1>
    <p>IDENTITY / REWARD / DIVINATION / UPGRADE / UI REVIEW REQUIRED</p>
  </header>

  <section>
    <h2>身份肖像</h2>
    <div class="grid  ">

        <figure>
          <img src="../../assets/svg/v0.4.0/identities/card-identity-reporter.svg" alt="identity.reporter">
          <figcaption><strong>identity.reporter</strong><span>512 × 640</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/identities/card-identity-doctor.svg" alt="identity.doctor">
          <figcaption><strong>identity.doctor</strong><span>512 × 640</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/identities/card-identity-gravedigger.svg" alt="identity.gravedigger">
          <figcaption><strong>identity.gravedigger</strong><span>512 × 640</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>场景</h2>
    <div class="grid scenes ">

        <figure>
          <img src="../../assets/svg/v0.4.0/scenes/gacha-altar.svg" alt="scene.gacha.altar">
          <figcaption><strong>scene.gacha.altar</strong><span>1600 × 900</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/scenes/reward-archive.svg" alt="scene.reward.archive">
          <figcaption><strong>scene.reward.archive</strong><span>1600 × 900</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>升级、碎片与祈愿图标</h2>
    <div class="grid  icons">

        <figure>
          <img src="../../assets/svg/v0.4.0/icons/upgrade-1.svg" alt="status.upgrade_1">
          <figcaption><strong>status.upgrade_1</strong><span>128 × 128</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/icons/upgrade-2.svg" alt="status.upgrade_2">
          <figcaption><strong>status.upgrade_2</strong><span>128 × 128</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/icons/upgrade-3.svg" alt="status.upgrade_3">
          <figcaption><strong>status.upgrade_3</strong><span>128 × 128</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/icons/card-shard.svg" alt="resource.card_shard">
          <figcaption><strong>resource.card_shard</strong><span>128 × 128</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.4.0/icons/divination-ticket.svg" alt="resource.divination_ticket">
          <figcaption><strong>resource.divination_ticket</strong><span>128 × 128</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>卡背</h2>
    <div class="grid  ">

        <figure>
          <img src="../../assets/svg/v0.4.0/cards/card-back-sealed-omen.svg" alt="card.back.sealed_omen">
          <figcaption><strong>card.back.sealed_omen</strong><span>512 × 720</span></figcaption>
        </figure>

    </div>
  </section>

</body>
</html>
