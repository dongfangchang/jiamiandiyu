<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>假面低语 v0.5.0 · 美术候选</title>
  <style>
    :root { color-scheme:dark; --ink:#10130f; --gold:#b99750; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:#e8dfc9; font-family:"Noto Serif SC","Songti SC",Georgia,serif; }
    header { padding:36px 5vw 20px; border-bottom:1px solid #5a4a31; }
    h1 { margin:0; font-size:44px; letter-spacing:.12em; }
    header p { color:var(--gold); letter-spacing:.14em; }
    section { padding:18px 4vw 22px; }
    h2 { color:var(--gold); font-size:18px; letter-spacing:.16em; border-bottom:1px solid #453b29; padding-bottom:7px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    .grid.icons { grid-template-columns:repeat(5,1fr); }
    .grid.cards { grid-template-columns:repeat(3,1fr); }
    figure { margin:0; background:#1a1e19; border:1px solid #473e2c; }
    img { display:block; width:100%; height:280px; object-fit:contain; background:#141813; }
    .icons img { height:130px; }
    .cards img { height:420px; }
    figcaption { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; font-size:11px; color:#a99b7f; }
    figcaption strong { color:#e8dfc9; font-weight:500; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>假面低语 · v0.5 美术候选</h1>
    <p>ROUTE / REST / BOSS / TAMPERED OBITUARY / UI REVIEW REQUIRED</p>
  </header>

  <section>
    <h2>路线与场景</h2>
    <div class="grid  ">

        <figure>
          <img src="../../assets/svg/v0.5.0/scenes/route-map.svg" alt="scene.route.v050.short_road">
          <figcaption><strong>scene.route.v050.short_road</strong><span>1600 × 900</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/scenes/rest-old-house.svg" alt="scene.rest.old_house">
          <figcaption><strong>scene.rest.old_house</strong><span>1600 × 900</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/scenes/ritual-tampered-obituary.svg" alt="scene.ritual.tampered_obituary">
          <figcaption><strong>scene.ritual.tampered_obituary</strong><span>1600 × 900</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>首领</h2>
    <div class="grid  ">

        <figure>
          <img src="../../assets/svg/v0.5.0/enemies/enemy-mirror-baron.svg" alt="enemy.mirror_baron">
          <figcaption><strong>enemy.mirror_baron</strong><span>900 × 900</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>晋升仪式</h2>
    <div class="grid  cards">

        <figure>
          <img src="../../assets/svg/v0.5.0/rituals/ritual-card-name-record.svg" alt="ritual.card.name_record">
          <figcaption><strong>ritual.card.name_record</strong><span>420 × 600</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/rituals/ritual-card-chronology.svg" alt="ritual.card.chronology">
          <figcaption><strong>ritual.card.chronology</strong><span>420 × 600</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/rituals/ritual-card-seal.svg" alt="ritual.card.seal">
          <figcaption><strong>ritual.card.seal</strong><span>420 × 600</span></figcaption>
        </figure>

    </div>
  </section>

  <section>
    <h2>状态图标</h2>
    <div class="grid icons ">

        <figure>
          <img src="../../assets/svg/v0.5.0/icons/route-pending.svg" alt="status.route.pending">
          <figcaption><strong>status.route.pending</strong><span>96 × 96</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/icons/route-current.svg" alt="status.route.current">
          <figcaption><strong>status.route.current</strong><span>96 × 96</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/icons/route-completed.svg" alt="status.route.completed">
          <figcaption><strong>status.route.completed</strong><span>96 × 96</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/icons/ritual-success.svg" alt="status.ritual.success">
          <figcaption><strong>status.ritual.success</strong><span>128 × 128</span></figcaption>
        </figure>

        <figure>
          <img src="../../assets/svg/v0.5.0/icons/ritual-failure.svg" alt="status.ritual.failure">
          <figcaption><strong>status.ritual.failure</strong><span>128 × 128</span></figcaption>
        </figure>

    </div>
  </section>

</body>
</html>
