      <feBlend in="SourceGraphic" in2="f" mode="multiply"/>
    </filter>
  </defs>
  <rect width="512" height="400" fill="url(#paper)" filter="url(#grain)"/>
  <rect width="512" height="400" fill="url(#hatch)"/>
