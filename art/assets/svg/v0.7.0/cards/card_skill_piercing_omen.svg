<svg xmlns="http://www.w3.org/2000/svg" width="512" height="400" viewBox="0 0 512 400">
  <defs>
    <radialGradient id="paperWash" cx="46%" cy="40%" r="78%">
      <stop offset="0" stop-color="#F1E4C8"/>
      <stop offset=".6" stop-color="#D8C29A"/>
      <stop offset="1" stop-color="#AF9165"/>
    </radialGradient>
    <linearGradient id="nightWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090D09"/>
      <stop offset=".55" stop-color="#2A3029"/>
      <stop offset="1" stop-color="#070A07"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D091"/>
      <stop offset=".45" stop-color="#B99750"/>
      <stop offset="1" stop-color="#5D4726"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(27)">
      <path d="M0 0V8" stroke="#211D18" stroke-width=".7" opacity=".12"/>
    </pattern>
    <pattern id="crosshatch" width="11" height="11" patternUnits="userSpaceOnUse">
      <path d="M0 0L11 11M11 0L0 11" stroke="#E8DFC9" stroke-width=".45" opacity=".06"/>
    </pattern>
    <filter id="grain" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".61" numOctaves="3" seed="71" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    
  </defs>
  
    <rect width="512" height="400" fill="url(#paperWash)" filter="url(#grain)"/>
    <rect width="512" height="400" fill="url(#hatch)"/>
    <rect x="18" y="18" width="476" height="364" fill="none" stroke="#211D18" stroke-width="2" opacity=".66"/>
    <path d="M18 42H64M448 18H494M18 358H64M448 382H494"
      stroke="#B99750" stroke-width="2" opacity=".75"/>
    <circle cx="256" cy="200" r="146" fill="none" stroke="#211D18" stroke-width=".8" stroke-dasharray="2 9" opacity=".28"/>
  
    <circle cx="256" cy="200" r="126" fill="#3A3731" opacity=".08"/>
    <circle cx="256" cy="200" r="112" fill="none" stroke="#B99750" stroke-width="1" stroke-dasharray="3 8" opacity=".78"/>
  
      <circle cx="256" cy="200" r="128" fill="#3A3731" opacity=".72" stroke="#B99750" stroke-width="2"/>
      <circle cx="256" cy="200" r="97" fill="#E8DFC9" opacity=".2" stroke="#211D18" stroke-width="2"/>
