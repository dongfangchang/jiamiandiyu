      <circle cx="353" cy="186" r="24" fill="#788079" stroke="#211D18" stroke-width="3"/>
      <circle cx="158" cy="183" r="9" fill="#211D18"/>
      <circle cx="353" cy="186" r="9" fill="#211D18"/>
