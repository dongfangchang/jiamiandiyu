<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <title>Desk World · 2D content layouts per station</title>
  <style>
    .h { font-family: "Source Han Serif SC", "Noto Serif CJK SC", serif; font-size: 17px; fill: #2a1810; font-weight: 600; }
    .l { font-family: "Source Han Serif SC", serif; font-size: 12px; fill: #3a2a1a; }
    .s { font-family: "Source Han Serif SC", serif; font-size: 10px; fill: #6a5040; }
    .box { fill: #f5ecd8; stroke: #3a2a1a; stroke-width: 1.5; }
  </style>
  <rect width="1000" height="720" fill="#ebe2d4"/>
  <text x="500" y="28" text-anchor="middle" class="h">站位 2D 内容版式线框</text>

  <!-- title -->
  <rect x="40" y="50" width="280" height="200" class="box" rx="4"/>
  <text x="180" y="72" text-anchor="middle" class="l">station.title</text>
  <rect x="70" y="90" width="220" height="130" fill="#5a3020" stroke="#2a1810"/>
  <rect x="110" y="145" width="140" height="48" fill="#e8dcc8" stroke="#8a6040"/>
  <text x="180" y="165" text-anchor="middle" class="s">DW-04 书签纸条</text>
  <text x="180" y="180" text-anchor="middle" class="s">序列 · 章名 · 继续</text>
  <text x="180" y="235" text-anchor="middle" class="s">合书 DW-05 · 无平面面板</text>

  <!-- dossier -->
  <rect x="360" y="50" width="280" height="200" class="box" rx="4"/>
  <text x="500" y="72" text-anchor="middle" class="l">station.dossier</text>
  <rect x="375" y="90" width="115" height="140" fill="#efe6d4" stroke="#3a2a1a"/>
  <rect x="390" y="105" width="70" height="90" fill="#d0c0a8" stroke="#5a4030"/>
  <text x="432" y="155" text-anchor="middle" class="s">DW-03</text>
  <text x="432" y="215" text-anchor="middle" class="s">姓名+序列</text>
  <rect x="510" y="90" width="115" height="140" fill="#efe6d4" stroke="#3a2a1a"/>
  <text x="567" y="120" text-anchor="middle" class="s">资源</text>
  <text x="567" y="140" text-anchor="middle" class="s">局况</text>
  <text x="567" y="160" text-anchor="middle" class="s">当前章</text>
  <text x="567" y="200" text-anchor="middle" class="s">纸签确认</text>
  <text x="500" y="245" text-anchor="middle" class="s">左右页 · DW-02 纸</text>

  <!-- desk -->
  <rect x="680" y="50" width="280" height="200" class="box" rx="4"/>
  <text x="820" y="72" text-anchor="middle" class="l">station.desk</text>
  <circle cx="760" cy="140" r="28" fill="#6b4428"/>
  <circle cx="820" cy="130" r="36" fill="#e8dcc8" stroke="#3a2a1a"/>
  <circle cx="880" cy="145" r="24" fill="#4a3020"/>
  <rect x="790" y="95" width="72" height="24" fill="#f0e6d0" stroke="#8a6040"/>
  <text x="826" y="111" text-anchor="middle" class="s">DW-07 题签</text>
  <text x="820" y="220" text-anchor="middle" class="s">悬停才出题签 · 无常驻 HUD</text>

  <!-- diary -->
  <rect x="40" y="280" width="280" height="200" class="box" rx="4"/>
  <text x="180" y="302" text-anchor="middle" class="l">station.diary</text>
  <rect x="55" y="320" width="115" height="140" fill="#d8c8b0" stroke="#3a2a1a"/>
  <text x="112" y="390" text-anchor="middle" class="s">左 · 插画</text>
  <rect x="190" y="320" width="115" height="140" fill="#efe6d4" stroke="#3a2a1a"/>
  <text x="247" y="360" text-anchor="middle" class="s">题名≤10</text>
  <text x="247" y="380" text-anchor="middle" class="s">笔迹≤60</text>
  <circle cx="247" cy="420" r="16" fill="#a03028"/>
  <text x="247" y="425" text-anchor="middle" class="s" fill="#f5ecd8">蜡</text>
  <text x="180" y="475" text-anchor="middle" class="s">现 BRIEF · 进战 T3</text>

  <!-- cardbox -->
  <rect x="360" y="280" width="280" height="200" class="box" rx="4"/>
  <text x="500" y="302" text-anchor="middle" class="l">station.cardbox</text>
  <rect x="390" y="330" width="160" height="90" fill="#3d2818" stroke="#a08050"/>
  <rect x="405" y="345" width="30" height="45" fill="#e8dcc8"/>
  <rect x="445" y="345" width="30" height="45" fill="#e8dcc8"/>
  <rect x="485" y="345" width="30" height="45" fill="#e8dcc8"/>
  <circle cx="580" cy="380" r="22" fill="#5a4030"/>
  <text x="580" y="385" text-anchor="middle" class="s" fill="#e8dcc8">袋</text>
  <text x="500" y="455" text-anchor="middle" class="s">摊牌 + 残页袋升级 · X2 美术后精修</text>

  <!-- altar + drawer -->
  <rect x="680" y="280" width="280" height="200" class="box" rx="4"/>
  <text x="820" y="302" text-anchor="middle" class="l">altar / drawer</text>
  <circle cx="760" cy="380" r="40" fill="none" stroke="#7a9aaa" stroke-dasharray="4 3"/>
  <circle cx="760" cy="380" r="18" fill="#2a3540"/>
  <text x="760" y="435" text-anchor="middle" class="s">altar 纸签环绕</text>
  <rect x="850" y="340" width="70" height="90" fill="#4a3220" stroke="#2a1810"/>
  <text x="885" y="390" text-anchor="middle" class="s" fill="#e8dcc8">卷</text>
  <text x="885" y="450" text-anchor="middle" class="s">drawer</text>

  <rect x="40" y="510" width="920" height="180" class="box" rx="4"/>
  <text x="60" y="540" class="l">输入状态（全站共用）</text>
  <text x="60" y="570" class="s">悬停：DW-07 题签淡入 · 轻微提亮</text>
  <text x="60" y="590" class="s">按下：题签/蜡点下沉 → travel(station) 或命令</text>
  <text x="60" y="610" class="s">禁用：虚线题签或不显示 · 点击忽略</text>
  <text x="60" y="630" class="s">锁定：锁印 + 原因文案（快照 ID→文案表）· 点击忽略或只读纸签</text>
  <text x="60" y="660" class="s">过渡期间：路由器锁输入 · 禁止同步 load 大纹理（EXPERIENCE §4）</text>
</svg>
