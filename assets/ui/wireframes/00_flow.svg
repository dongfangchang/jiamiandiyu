<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b99750"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#15160f"/>
  <text x="80" y="86" fill="#e8dfc9" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">《假面低语》页面流</text>
  <text x="80" y="124" fill="#9f967f" font-family="Microsoft YaHei, sans-serif" font-size="18">1600×900 · v0.2.0 低保真导航与返回路径</text>

  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <g>
      <rect x="65" y="205" width="220" height="92" rx="8" fill="#28251d" stroke="#b99750" stroke-width="2"/>
      <text x="175" y="244" fill="#e8dfc9" font-size="20">启动 / 继续</text>
      <text x="175" y="273" fill="#9f967f" font-size="14">本地存档检测</text>
    </g>
    <line x1="285" y1="251" x2="365" y2="251" stroke="#b99750" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="370" y="205" width="220" height="92" rx="8" fill="#28251d" stroke="#b99750" stroke-width="2"/>
