<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d48a"/>
      <stop offset="55%" stop-color="#c48a3a"/>
      <stop offset="100%" stop-color="#6a3a18"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#8a2a1c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- soft ink aura -->
  <ellipse cx="168" cy="188" rx="42" ry="18" fill="#6a1810" fill-opacity="0.35"/>
  <!-- feather body -->
  <path d="M48 42 C78 28 118 36 148 58 C178 80 198 118 208 152 C168 128 128 98 96 72 C78 58 62 50 48 42 Z"
        fill="url(#shaft)" filter="url(#glow)"/>
  <!-- feather barbs -->
  <g stroke="#7a4820" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M70 55 C98 68 120 88 142 112"/>
    <path d="M82 48 C112 64 136 90 156 118"/>
    <path d="M62 68 C92 82 118 104 140 128"/>
  </g>
  <!-- quill tip -->
  <path d="M198 148 L232 214 L186 178 Z" fill="url(#nib)"/>
  <path d="M208 168 L224 204" stroke="#4a140e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ink bead -->
  <circle cx="228" cy="210" r="7" fill="#5a120e"/>
  <circle cx="236" cy="200" r="3.5" fill="#3a0c08" fill-opacity="0.8"/>
</svg>
